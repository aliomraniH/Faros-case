enance": "sourced", "pillar": "govern", "summary": "Central policy with distributed context, provenance/audit, and compensating controls (feature flags over hard blocks) — humans still review and merge.", "interview_question": "What in Govern is live versus roadmap, and how is a 'compensating control' more than a feature flag with a nicer name?", "competitor": {"key": "copilot", "name": "GitHub Copilot", "domain": "github.com", "color": "#24292F", "mono": "GH", "positioning": "GitHub native branch protection, rulesets, and Advanced Security already govern what merges; the platform incumbent argues governance lives in the SCM, not a layer above it."}}, {"id": "faros:governance-guardrails", "type": "faros", "title": "Governance & Guardrails — policy, flags, code tagging", "parent": "faros:govern", "status": "proposed", "honesty": "inference", "provenance": "sourced", "pillar": "govern", "summary": "Enforce governance and guardrails at scale via policy, feature flags, and code tagging.", "interview_question": "You marked this 'inference' — what can you actually demonstrate today versus what you're hoping to ship?", "competitor": {"key": "copilot", "name": "GitHub Copilot", "domain": "github.com", "color": "#24292F", "mono": "GH", "positioning": "GitHub Advanced Security and native policy enforcement are the established guardrail layer most enterprises already pay for."}}, {"id": "faros:provenance-audit-trail", "type": "faros", "title": "Provenance & Audit Trail — ticket to shipped change", "parent": "faros:govern", "status": "proposed", "honesty": "shipped", "provenance": "sourced", "pillar": "govern", "summary": "Audit trails from ticket to shipped change for AI regulatory compliance.", "interview_question": "With the EU AI Act high-risk deadline now deferred to Dec 2027, how do you keep this from being a compliance feature looking for a deadline?", "competitor": {"key": "datadog", "name": "Datadog", "domain": "datadoghq.com", "color": "#632CA6", "mono": "Dd", "positi  capitalization reports automatically — no manual spreadsheets.", "interview_question": "Capitalization is a finance workflow far from AI ROI — why is Faros the right vendor for the CFO's auditors?", "competitor": {"key": "jellyfish", "name": "Jellyfish", "domain": "jellyfish.co", "color": "#00B3A4", "mono": "J", "positioning": "Jellyfish explicitly sells software capitalization to finance teams already — a direct, mature competitor on this exact node."}}, {"id": "flow:board-asks-roi", "type": "flow", "title": "Flow — board asks 'what did the AI spend buy?'", "parent": "organization:root", "status": "approved", "provenance": "inferred", "summary": "The reporting flow where Maya must answer the board on AI spend with evidence, spanning Copilot/Cursor/Claude Code spend, delivery dashboards, surveys, and a spreadsheet.", "interview_question": "Walk me through this flow the way Maya lives it — where exactly does today's tooling leave her without an answer?", "competitor": {"key": "cloudzero", "name": "CloudZero", "domain": "cloudzero.com", "color": "#2563EB", "mono": "Cz", "positioning": "CloudZero's survey says 87% of finance leaders need to tie AI spend to results and only 22% can — but CloudZero sells the spend side and stops at 'a chart, not a chargeback.'"}}, {"id": "flow:incident-to-cause", "type": "flow", "title": "Flow — from production incident to root cause", "parent": "organization:root", "status": "approved", "provenance": "inferred", "summary": "The signature flow: a P1 incident traced back through deploy and PR to the AI session and the context it did or didn't have.", "interview_question": "When you say you trace an incident to the AI session that caused it — is that an observed edge or an inference at the PR/aggregate level?", "competitor": {"key": "rootly", "name": "Rootly", "domain": "rootly.com", "color": "#FF4F64", "mono": "R", "positioning": "Rootly and incident.io tie an incident to its causing PR and resolve single incidents deeper than Faros — but they stop before the AI session and spend."}}, {"id": "mapping:maya-roi-ledger", "type": "mapping", "title": "Mapping — Maya's board-ROI pain → Token Attribution Ledger", "parent": "organization:root", "status": "approved", "honesty": "shipped", "provenance": "sourced", "summary": "Maps Maya's 'can't tell the board what the spend produced' to the Token Attribution Ledger that ties dollars to shipped outcomes — the 'door' card.", "interview_question": "This is your opening move. What's the single proof point that makes the board believe the attribution?", "competitor": {"key": "harness", "name": "Harness", "domain": "harness.io", "color": "#00ADE4", "mono": "H", "positioning": "Harness AI DLC Insights targets the identical board-ROI buying moment with a 'token spend → shipped software' pitch."}}, {"id": "mapping:maya-tool-rationalization", "type": "mapping", "title": "Mapping — which AI tools/models are worth keeping → Optimize", "parent": "organization:root", "status": "approved", "honesty": "roadmap", "provenance": "sourced", "summary": "Maps 'too many tools/models — which to keep, scope, or cut' to Optimize's keep/scope/cut verdicts and per-task model recommendations.", "interview_question": "A keep/scope/cut verdict is a strong claim — what evidence backs a 'cut' recommendation that a VP would stake budget on?", "competitor": {"key": "vantage", "name": "Vantage", "domain": "vantage.sh", "color": "#0F172A", "mono": "V", "positioning": "Vantage and CloudZero already give spend-rationalization verdicts on the cost side; they own 'what to cut' for FinOps but can't tie it to delivered outcomes."}}, {"id": "mapping:maya-incident-observe", "type": "mapping", "title": "Mapping — Maya's incident-to-cause pain → Observe", "parent": "organization:root", "status": "approved", "honesty": "shipped", "provenance": "inferred", "summary": "Maps the 'trail goes cold at every tool boundary' pain to the Observe graph that joins the chain and reaches the one missing repo rule.", "interview_question": "What does 'the trail goes cold' look like in a real customer's stack, and how many boundaries does Observe actually cross unaided?", "competitor": {"key": "rootly", "name": "Rootly", "domain": "rootly.com", "color": "#FF4F64", "mono": "R", "positioning": "Rootly/incident.io own incident→PR causation and the on-call's trust; they argue root-cause lives in the incident tool, not an analytics graph."}}, {"id": "mapping:maya-learning-negmem", "type": "mapping", "title": "Mapping — Maya's repeat-mistakes pain → Negative Memory", "parent": "organization:root", "status": "approved", "honesty": "roadmap", "provenance": "inferred", "summary": "Maps 'agents repeat last week's mistake; lessons live in one senior's head' to replaying the failed session and writing the rule back into repo context.", "interview_question": "Negative memory is the most compelling story and it's roadmap — how do you sell the vision without over-promising it as shipped?", "competitor": {"key": "unblocked", "name": "Unblocked", "domain": "getunblocked.com", "color": "#7C3AED", "mono": "U", "positioning": "Unblocked and Pieces own developer/team memory of past context; they capture knowledge but not an org-level negative-memory governance loop."}}, {"id": "mapping:maya-predictability-delivery", "type": "mapping", "title": "Mapping — Maya's 'answer up, deliver commitments' → Predictable Delivery", "parent": "organization:root", "status": "proposed", "honesty": "inference", "provenance": "inferred", "summary": "Maps Maya's pressure to hit and report commitments without policing the team to delivery tracking, forecasting, and capacity analytics.", "interview_question": "You labelled this 'inference' — what's the evidence the delivery surface actually serves Maya's pain, not just exists on the site?", "competitor": {"key": "jellyfish", "name": "Jellyfish", "domain": "jellyfish.co", "color": "#00B3A4", "mono": "J", "positioning": "Jellyfish/LinearB are the established answer to 'predict and report delivery'; this mapping competes on their core promise."}}, {"id": "mapping:maya-rework-context", "type": "mapping", "title": "Mapping — Maya's 'throughput up, rework up' → Clara Context Engine", "parent": "organization:root", "status": "proposed", "honesty": "inference", "provenance": "inferred", "summary": "Maps 'AI shifted the bottleneck to review; bugs and rework rising faster than throughput' to Clara's review-ready, context-bootstrapped agent PRs.", "interview_question": "'40% less rework' — is that a Faros customer result or a marketing number? What's independent here?", "competitor": {"key": "sonarqube", "name": "SonarQube", "domain": "sonarsource.com", "color": "#126ED3", "mono": "Sq", "positioning": "SonarQube and GitClear own code-quality/churn measurement (GitClear's churn data even corroborates the problem) — they quantify rework but don't fix it at the agent-context level."}}, {"id": "mapping:maya-devex-friction", "type": "mapping", "title": "Mapping — Maya's 'empower the team, never rank it' → Developer Experience", "parent": "organization:root", "status": "proposed", "honesty": "inference", "provenance": "inferred", "summary": "Maps 'help not surveillance; improve the team without ranking individuals' to DevEx that exposes variability across teams, not people.", "interview_question": "How do you guarantee a 'team variability' view doesn't get turned into an individual ranking by the customer's own managers?", "competitor": {"key": "dx", "name": "DX (Atlassian)", "domain": "getdx.com", "color": "#111827", "mono": "DX", "positioning": "DX (Atlassian) is the gold standard for survey-based, non-ranking DevEx measurement and would be Maya's natural first call here."}}, {"id": "mapping:maya-adoption-aitransformation", "type": "mapping", "title": "Mapping — Maya's 'make adoption stick & prove ROI' → AI Transformation", "parent": "organization:root", "status": "proposed", "honesty": "inference", "provenance": "inferred", "summary": "Maps 'board wants the AI line item justified; adoption is uneven' to AI Transformation's causal ROI, cohort tests, CFO reports, and GAINS.", "interview_question": "What's your honest read on adoption — does Faros prove ROI, or just measure adoption and call it ROI?", "competitor": {"key": "jellyfish", "name": "Jellyfish", "domain": "jellyfish.co", "color": "#00B3A4", "mono": "J", "positioning": "Jellyfish's AI Impact is the incumbent 'prove AI adoption ROI' report; the buyer will demand the causal-vs-correlation distinction be made obvious."}}, {"id": "mapping:maya-surveillance-govern", "type": "mapping", "title": "Mapping — 'is this surveillance?' → repo/system-level governance", "parent": "organization:root", "status": "approved", "honesty": "shipped", "provenance": "inferred", "summary": "Maps the surveillance fear to the discipline that everything lands at repo/system level — context, flags, traces, policy — never individual keystrokes.", "interview_question": "What technically prevents a customer from using your data to rank or monitor individual engineers?", "competitor": {"key": "dx", "name": "DX (Atlassian)", "domain": "getdx.com", "color": "#111827", "mono": "DX", "positioning": "The anti-pattern is older developer-productivity/surveillance tooling that ranks individuals; Faros must visibly distance itself from that whole category."}}, {"id": "mapping:maya-govern-velocity", "type": "mapping", "title": "Mapping — govern AI merges without slowing down → compensating controls", "parent": "organization:root", "status": "approved", "honesty": "roadmap", "provenance": "inferred", "summary": "Maps 'govern AI merges without killing velocity' to compensating controls — ship behind a feature flag instead of a hard block; a human still merges.", "interview_question": "A feature flag is a developer convention, not governance — what makes this a control a CISO would sign off on?", "competitor": {"key": "copilot", "name": "GitHub Copilot", "domain": "github.com", "color": "#24292F", , not just could happen?", "competitor": {"key": "unblocked", "name": "Unblocked", "domain": "getunblocked.com", "color": "#7C3AED", "mono": "U", "positioning": "Unblocked/Pieces sell 'capture and reuse team knowledge'; they own the personal/team memory story but not the human+agent governance loop Faros frames."}}]}, "critic": {"built": "2026-06-30T00:00:00+00:00", "namespace": "dev/faros-case", "description": "Critic graph: Faros knowledge nodes clustered by competitor line-of-attack, each carrying the toughest interviewer question.", "themes": [{"id": "correlation-not-causation", "label": "“That’s correlation, not causation”", "desc": "Rivals already ship AI-impact / ROI reports; the attack is that Faros’s causal claim is unproven and indistinguishable from correlation on a slide.", "color": "#E5484D", "competitors": [{"key": "cloudzero", "name": "CloudZero", "domain": "cloudzero.com", "color": "#2563EB", "mono": "Cz"}, {"key": "dx", "name": "DX (Atlassian)", "domain": "getdx.com", "color": "#111827", "mono": "DX"}, {"key": "harness", "name": "Harness", "domain": "harness.io", "color": "#00ADE4", "mono": "H"}, {"key": "jellyfish", "name": "Jellyfish", "domain": "jellyfish.co", "color": "#00B3A4", "mono": "J"}], "targets": ["faros:ai-transformation", "faros:gains", "faros:executive-scorecards", "mapping:maya-adoption-aitransformation", "mapping:maya-roi-ledger", "flow:board-asks-roi"], "questions": [{"id": "faros:ai-transformation", "title": "AI Transformation — measure and scale AI adoption with ROI", "q": "What exactly is the 'causal analysis' here — and can you defend it without naming an estimator you haven't published?"}, {"id": "faros:gains", "title": "GAINS — Generative AI Impact Net Score diagnostic", "q": "Is GAINS a real diagnostic with a defensible scale, or a lead-gen framework? What's the n behind the benchmark?"}, {"id": "faros:executive-scorecards", "title": "Executive Scorecards — boardroom KPI & AI-impact view", "q": "What does a CFO see here that /* ---------- pan/zoom ---------- */
const svg=document.getElementById('svg'), vp=document.getElementById('vp');
let view={x:0,y:0,k:1};
function apply(){vp.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();
 const mx=(e.clientX-r.left)/r.width*1000,my=(e.clientY-r.top)/r.height*1000;
 const f=e.deltaY<0?1.12:1/1.12;const nk=Math.max(.4,Math.min(4,view.k*f));
 view.x=mx-(mx-view.x)*(nk/view.k);view.y=my-(my-view.y)*(nk/view.k);view.k=nk;apply();},{passive:false});
let drag=null;
svg.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};svg.classList.add('drag');});
window.addEventListener('mousemove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();
 view.x=drag.vx+(e.clientX-drag.x)/r.width*1000;view.y=drag.vy+(e.clientY-drag.y)/r.height*1000;apply();});
window.addEventListener('mouseup',()=>{drag=null;svg.classList.remove('drag');});

function resetView(){view={x:0,y:0,k:1};apply();}
const SVGNS='http://www.w3.org/2000/svg';
function el(t,a){const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}

/* ---------- radial tree layout (deterministic) ---------- */
function buildTree(){
 const kids={}; G.nodes.forEach(n=>kids[n.id]=[]);
 let root=null;
 G.nodes.forEach(n=>{ if(n.parent && kids[n.parent]) kids[n.parent].push(n.id); else if(!n.parent) root=n.id; });
 // order children: faros subtree first, then flows, mappings, persona, principles
 const ord={faros:0,flow:1,mapping:2,persona:3,principle:4,organization:9};
 Object.values(kids).forEach(a=>a.sort((x,y)=>(ord[byId[x].type]-ord[byId[y].type])||x.localeCompare(y)));
 const leaves=id=>kids[id].length?kids[id].reduce((s,c)=>s+leaves(c),0):1;
 const pos={};
 const R=[0,150,265,360,440];
 function place(id,depth,a0,a1){
   const a=(a0+a1)/2, r=R[Math.min(depth,4)];
   pos[id]={x:500+r*Math.cos(a),y:500+r*Math.sin(a),depth,angle:a};
   const tot=leaves(id)||1; let acc=a0;
   kids[id].forEach(c=>{const span=(a1-a0)*(leaves(c)/tot);place(c,depth+1,acc,acc+span);acc+=span;});
 }
 place(root,0,-Math.PI/2, -Math.PI/2+2*Math.PI);
 pos[root]={x:500,y:500,depth:0,angle:0};
 return {kids,root,pos};
}

function drawGraph(){
 vp.innerHTML=''; resetView();
 const {kids,root,pos}=buildTree();
 // links
 G.nodes.forEach(n=>{ if(n.parent&&pos[n.parent]){const p=pos[n.parent],c=pos[n.id];
   const path=el('path',{class:'link','data-a':n.parent,'data-b':n.id,
    d:`M${p.x},${p.y} C ${(p.x+c.x)/2},${p.y} ${(p.x+c.x)/2},${c.y} ${c.x},${c.y}`}); vp.appendChild(path);} });
 // nodes
 G.nodes.forEach(n=>{
   const p=pos[n.id]; const g=el('g',{class:'node','data-id':n.id});
   const color=css(TYPE[n.type]||'--mut'); g.style.color=color;
   const rad = n.type==='faros'? (n.id==='faros:root'?16: (n.parent==='faros:root'?11:8)) : (n.id==='organization:root'?18:10);
   const c=el('circle',{r:rad,cx:p.x,cy:p.y,fill:'#0e1320',stroke:color,'stroke-width':n.status==='approved'?3:1.6});
   if(n.status!=='approved') c.setAttribute('stroke-dasharray','3,3');
   g.appendChild(c);
   // honesty ring dot
   if(n.honesty){const hc={shipped:css('--shipped'),roadmap:css('--roadmap'),inference:css('--inference')}[n.honesty];
     g.appendChild(el('circle',{r:3,cx:p.x+rad-1,cy:p.y-rad+1,fill:hc,stroke:'#0b0e17','stroke-width':1}));}
   const right=Math.cos(p.angle)>=0;
   const tx=el('text',{x:p.x+(right?rad+6:-(rad+6)),y:p.y+4,'text-anchor':right?'start':'end'});
   tx.textContent=short(n.title); g.appendChild(tx);
   g.addEventListener('click',()=>{selectNode(n.id);highlight(n.id,kids);});
   g.addEventListener('mouseenter',()=>highlight(n.id,kids));
   g.addEventListener('mouseleave',clearHi);
   vp.appendChild(g);
 });
}
function highlight(id,kids){
 const keep=new Set([id]); let cur=byId[id]; while(cur&&cur.parent){keep.add(cur.parent);cur=byId[cur.parent];}
 (function down(i){ (kids[i]||[]).forEach(c=>{keep.add(c);down(c);}); })(id);
 document.querySelectorAll('.node').forEach(g=>g.classList.toggle('dim',!keep.has(g.dataset.id)));
 document.querySelectorAll('#vp .link').forEach(l=>l.classList.toggle('dim',!(keep.has(l.dataset.a)&&keep.has(l.dataset.b))));
 const me=document.querySelector(`.node[data-id="${CSS.escape(id)}"]`); if(me)me.classList.add('hot');
}
function clearHi(){document.querySelectorAll('.node').forEach(g=>g.classList.remove('dim','hot'));document.querySelectorAll('#vp .link').forEach(l=>l.classList.remove('dim'));}

/* ---------- critic graph layout ---------- */
function drawCritic(){
 vp.innerHTML=''; resetView();
 const cx=500,cy=500, ringR=330, n=C.themes.length;
 // center hub
 vp.appendChild(el('circle',{cx,cy,r:54,fill:'#1a1020',stroke:css('--accent'),'stroke-width':3}));
 const ht=el('text',{x:cx,y:cy-4,'text-anchor':'middle'});ht.setAttribute('font-size','13');ht.setAttribute('font-weight','800');ht.style.fill=css('--ink');ht.textContent='Faros'; vp.appendChild(ht);
 const ht2=el('text',{x:cx,y:cy+13,'text-anchor':'middle'});ht2.setAttribute('font-size','10');ht2.style.fill=css('--mut');ht2.textContent='under fire'; vp.appendChild(ht2);
 C.themes.forEach((t,i)=>{
   const a=-Math.PI/2 + i/n*2*Math.PI;
   const x=cx+ringR*Math.cos(a), y=cy+ringR*Math.sin(a);
   t.__x=x;t.__y=y;
   const lk=el('path',{class:'link',d:`M${cx},${cy} C ${cx+(x-cx)*.4},${cy} ${x-(x-cx)*.4},${y} ${x},${y}`,'data-t':t.id});
   lk.style.stroke=t.color; lk.style.opacity=.5; lk.style.strokeWidth=Math.max(1.6,t.targets.length*0.7); vp.appendChild(lk);
 });
 C.themes.forEach((t)=>{
   const g=el('g',{class:'node','data-t':t.id}); g.style.color=t.color;
   const r=24+t.targets.length*2.2;
   g.appendChild(el('circle',{cx:t.__x,cy:t.__y,r,fill:'#11151f',stroke:t.color,'stroke-width':2.5}));
   const cnt=el('text',{x:t.__x,y:t.__y+5,'text-anchor':'middle'});cnt.setAttribute('font-size','15');cnt.setAttribute('font-weight','800');cnt.style.fill=t.color;cnt.style.stroke='none';cnt.textContent=t.targets.length;g.appendChild(cnt);
   // competitor monogram chips around the bubble
   t.competitors.slice(0,5).forEach((cp,j)=>{
     const ca=t.__x<cx? Math.PI: 0; const off=(j-(Math.min(t.competitors.length,5)-1)/2);
     const mx=t.__x+(t.__x<cx?-1:1)*(r+14), my=t.__y+off*20;
     const mg=el('g',{}); mg.appendChild(el('rect',{x:mx-9,y:my-9,width:18,height:18,rx:5,fill:cp.color,stroke:'#0b0e17','stroke-width':1}));
     const mt=el('text',{x:mx,y:my+4,'text-anchor':'middle'});mt.setAttribute('font-size','9');mt.setAttribute('font-weight','800');mt.style.fill='#fff';mt.style.stroke='none';mt.textContent=cp.mono;mg.appendChild(mt);g.appendChild(mg);
   });
   const lab=el('text',{x:t.__x,y:t.__y+r+15,'text-anchor':'middle'});lab.setAttribute('font-size','10.5');lab.textContent=t.label.replace(/[“”]/g,'').slice(0,34);g.appendChild(lab);
   g.addEventListener('click',()=>selectTheme(t.id));
   g.addEventListener('mouseenter',()=>{document.querySelectorAll('.node').forEach(o=>o.classList.toggle('dim',o!==g&&o.dataset.t!==undefined&&o.dataset.t!==t.id));
     document.querySelectorAll('#vp .link').forEach(l=>l.classList.toggle('dim',l.dataset.t!==t.id));g.classList.add('hot');});
   g.addEventListener('mouseleave',clearHi);
   vp.appendChild(g);
 });
}

observing which tool-model fits which task; roadmap = auto-generating tailored skills/rules/tools per repo and adaptive routing."}, {"t": "principle", "x": "The pillar's whole job is turning observation into better agent performance — the frame is 'make your agents perform,' not 'spend less.'"}, {"t": "verify", "x": "Get the exact shipped-vs-roadmap line from Faros eng feature by feature, so the 'be specific' answer is theirs, not my inference."}], "faros:observe": [{"t": "shipped", "x": "The join is observed for ticket→PR→deploy and session→PR wherever connectors expose it — solid at session/file/decision grain."}, {"t": "inference", "x": "It becomes inference at session→incident and where a connector is coarse — e.g. Copilot API granularity. I'd name those two as the real boundaries before being pushed."}, {"t": "verify", "x": "Make the inventory: list every edge in the chain marked observed-vs-inferred per connector — that table is the honest, unbluffable answer to 'where does it break.'"}], "faros:govern": [{"t": "shipped", "x": "Live: provenance/audit from ticket to shipped change, and a human review/merge. Roadmap: central policy with distributed context."}, {"t": "inference", "x": "A compensating control is the flag plus the provenance graph and policy — the flag ships the change safely, the trail proves who approved it. That bundle is the control; the flag alone isn't."}, {"t": "build", "x": "Spec the minimal control a CISO signs off on — flag + required human approval + immutable audit record — and map it to a named framework (SOC2/ISO) so it's auditable, not a convention."}], "faros:governance-guardrails": [{"t": "shipped", "x": "Demoable today: the provenance/audit trail and the human review-and-merge gate."}, {"t": "inference", "x": "Policy enforcement, flags, and code tagging at scale are the intended shape, not shipped — I'd show the trail and call the rest direction."}, {"t": "build", "x": "Pick the one guardrail to ship first — likely code tagging tied to provenance — and prototype it, so 'inference' has a concrete next-shipped item behind it."}], "faros:provenance-audit-trail": [{"t": "shipped", "x": "It earns its keep without the regulation: it's how you do incident forensics and answer 'who approved this AI change and why' — useful the day a P1 hits, not just the day an auditor calls."}, {"t": "market", "x": "I'd state the date right — high-risk obligations deferred to Dec 2 2027 by the Digital Omnibus, transparency rules still live — so the pitch isn't manufactured deadline urgency."}, {"t": "reframe", "x": "Lead the value with incident forensics and trust, not compliance — develop that as the primary frame so the deadline deferral is irrelevant to the buy."}], "faros:delivery-excellence": [{"t": "inference", "x": "It extends the story only where it rides the graph (forecasting from real delivery signal); as a standalone PMO play it dilutes. So: keep it a graph-fed view, don't sell it as a planning product."}, {"t": "market", "x": "Jellyfish/LinearB own planning; competing there off-thesis is the dilution risk."}, {"t": "reframe", "x": "Decide the cut line: which delivery surfaces stay (graph-fed) and which drop from the core story — a real scope decision, which is the judgment the panel is testing."}], "faros:initiative-tracking": [{"t": "shipped", "x": "Because the forecast uses the graph's real delivery and capacity signal, not just ticket status — a Jira rollup forecasts off the tickets; this forecasts off the work."}, {"t": "inference", "x": "I'd still be candid the gap is narrow — the honest claim is 'a better-grounded forecast,' not a new category."}, {"t": "test", "x": "Show one forecast where the graph-grounded version caught a slip the ticket-only view missed — that's the only thing that separates it from a rollup."}], "faros:software-capitalization": [{"t": "shipped", "x": "Because the cap report is generated from already-attributed work in the graph — every capitalized hour traces to a real change, which is exactly what auditors want and spreadsheets can't give."}, {"t": "market", "x": "Jellyfish sells cap too, so I'd be honest it's competitive and non-core — justified by reusing the attribution graph, not by being a finance specialist."}, {"t": "verify", "x": "Confirm which standard the cap output is built against (ASC 350-40 / IAS 38) so 'audit-ready' is a specific compliance claim, not a vibe."}], "flow:board-asks-roi": [{"t": "independent", "x": "She pulls Copilot/Cursor/Claude Code spend from three consoles, delivery numbers from a dashboard, sentiment from a survey, and hand-assembles a deck — and still can't connect spend to outcome. CloudZero's survey: 87% need that link, 22% have it."}, {"t": "shipped", "x": "The exact stuck point is the join — every source is real, none connects spend→outcome — which is the one thing Observe does."}, {"t": "test", "x": "Script this as the live demo: the four-source manual scramble vs the one Faros view — the contrast is the pitch, so build it side-by-side."}], "flow:incident-to-cause": [{"t": "shipped", "x": "Incident→deploy→PR is observed — a real traced edge."}, {"t": "inference", "x": "PR→the specific AI session is inference at the PR/aggregate level — we don't claim a keystroke-level causal edge, and I'd say so before being pushed."}, {"t": "build", "x": "Scope what makes session→PR observed (session IDs in commit metadata) — naming the path to closing the inference is a stronger answer than just conceding it."}], "mapping:maya-roi-ledger": [{"t": "shipped", "x": "One traced row: this PR shipped this feature, ran on this many tokens, here's the chain. The board believes one row it can follow faster than any aggregate."}, {"t": "vendor", "x": "If I reach for 10x/40% headlines, I'd flag them vendor and put them after the row, never before it."}, {"t": "test", "x": "Pre-build that row from a real or realistic case as the opening artifact — the 'door' card lives or dies on having it ready."}], "mapping:maya-tool-rationalization": [{"t": "shipped", "x": "A cut is backed by the graph showing a tool's spend with no attributable outcome over a period — evidence of non-use, not opinion."}, {"t": "roadmap", "x": "An automated keep/scope/cut verdict is roadmap; today it's evidence the VP reads, not a button that decides."}, {"t": "build", "x": "Define the cut threshold — how much spend over what window below what outcome floor flags a 'cut' — because a VP stakes budget on a rule, not a hunch."}], "mapping:maya-incident-observe": [{"t": "shipped", "x": "Cold = the on-call hops tool to tool by hand: incident.io → deploy log → GitHub → the AI tool, rebuilding context at each boundary. Observe pre-joins those hops so the chain is already assembled."}, {"t": "inference", "x": "How many boundaries it crosses unaided depends on connector coverage — I'd show the real number for a given stack, not claim 'all.'"}, {"t": "verify", "x": "Map a real reference stack's boundaries and count which Observe crosses out-of-the-box vs needs config — concrete coverage beats 'it connects everything.'"}], "mapping:maya-learning-negmem": [{"t": "shipped", "x": "I sell the live half as proof of direction: Clara already learns from every merge and carries per-repo context. Negative memory is that loop pointed at failures — and I'd label it roadmap explicitly."}, {"t": "principle", "x": "Frame it as transfer of mastery closing the MIT learning gap — aspiration ('your best teams haven't seen their best yet'), never a shipped claim."}, {"t": "build", "x": "Prototype the smallest real version: one failed session replayed into one repo rule that blocks the repeat — a working sliver makes the vision credible without over-promising the loop."}], "mapping:maya-predictability-delivery": [{"t": "inference", "x": "Honest answer: I have no evidence yet — it plausibly maps to 'hit and report commitments without policing,' but it's on the site, not validated for Maya."}, {"t": "market", "x": "And Jellyfish/LinearB are the proven answer here, so I'd hold this mapping loosely."}, {"t": "verify", "x": "Test the mapping in one discovery call: does Maya actually reach for a delivery-forecast surface, or is this a feature looking for a persona? That settles the 'inference' honestly."}], "mapping:maya-rework-context": [{"t": "vendor", "x": "The 40% is a vendor number — I'd say that outright and not dress it as independent."}, {"t": "independent", "x": "What's independently established is the problem: GitClear's 211M-line study shows copy/paste up 8.3%→12.3% and duplicate blocks ~8x — so rework is real even if the 40% fix isn't independently verified."}, {"t": "test", "x": "Run a before/after rework measurement (churn, duplicate blocks) on a design partner with Clara context on vs off — that's how 40% stops being marketing and becomes a result."}], "mapping:maya-devex-friction": [{"t": "shipped", "x": "The data model aggregates at team/repo/system level — individual keystroke streams aren't collected or exposed, so there's no individual row to rank from."}, {"t": "inference", "x": "I won't claim a customer can never misuse an export — the honest guarantee is about what we surface, not what they do downstream."}, {"t": "build", "x": "Design the actual guardrail: a minimum-team-size floor and no individual drill-down in the schema — a structural guarantee beats a stated intention, and it's a real spec to write."}], "mapping:maya-adoption-aitransformation": [{"t": "public", "x": "Adoption is the easy measure; the ROI claim rests on the controlled cohort/A-B comparison ('separates gains from coincidence'). So: adoption is measured, ROI is argued from the comparison — and I won't blur them."}, {"t": "independent", "x": "MIT NANDA's 95%-no-P&L finding is exactly why I keep them separate — adoption without attributed outcome is the gap, not the proof."}, {"t": "verify", "x": "Pull a real Faros ROI case and check whether the lift came from a true holdout/cohort or a pre/post trend — that tells you hing to police with."}, {"t": "inference", "x": "Every DevEx vendor says 'we don't surveil' — so the only real enforcement is showing the granularity, and I'd show it rather than assert intent."}, {"t": "build", "x": "Turn the value into a verifiable constraint — aggregation floors + no individual drill-down, documented as a guarantee a customer can audit. That's enforcement, not a promise."}], "principle:transfer-of-mastery": [{"t": "shipped", "x": "What's real is the mechanism: Clara learns from every merged PR, so a senior's reviewed decision already propagates into the next agent run — transfer of mastery in miniature, today."}, {"t": "inference", "x": "Honest answer on the story: I don't have a named one — and I'd source a real one rather than invent it."}, {"t": "test", "x": "Find or instrument one concrete instance with a design partner — a lesson a senior fixed once that the system then applied automatically. That single story is the emotional close, so go get it."}]};

function renderResponses(id){
  var rs=(RESPONSES[id]||[]); if(!rs.length) return '';
  var ACT={shipped:1,independent:1,public:1,vendor:1,market:1};
  var VIS={principle:1,inference:1,roadmap:1,synthesis:1};
  var COL={shipped:'#2BB673',independent:'#16A4C9',public:'#3B82F6',vendor:'#E8A23D',market:'#6B8AB0',
           principle:'#8B6FF0',inference:'#B08AE8',roadmap:'#E8863D',synthesis:'#C264D9',
           verify:'#C9A227',test:'#D98E04',build:'#B8860B',reframe:'#E0B341'};
  var LBL={shipped:'SHIPPED',independent:'INDEPENDENT',public:'PUBLIC LANGUAGE',vendor:'VENDOR STAT',market:'MARKET FACT',
           principle:'PRINCIPLE',inference:'INFERENCE',roadmap:'ROADMAP',synthesis:'SYNTHESIS',
           verify:'VERIFY',test:'TEST / PROOF',build:'BUILD',reframe:'REFRAME'};
  var act=rs.filter(function(r){return ACT[r.t];});
  var vis=rs.filter(function(r){return VIS[r.t];});
  var res=rs.filter(function(r){return !ACT[r.t] && !VIS[r.t];});
  function row(r){var c=COL[r.t]||'#888';
    return '<div class="resp" style="border-left-color:'+c+'"><span class="rtag" style="background:'+c+'22;color:'+c+';border-color:'+c+'66">'+(LBL[r.t]||r.t)+'</span><span class="rx">'+r.x+'</span></div>';}
  function grp(items,color,title){return items.length?('<div class="respgrp"><div class="ghead" style="color:'+color+'">&#9679; '+title+'</div>'+items.map(row).join('')+'</div>'):'';}
  var s='<div class="sec"><h4>How to answer this</h4><div class="rnote">Each angle answers the question, labeled by what grounds it. <b style="color:#2BB673">Actual</b> = shipped capability &middot; independent evidence &middot; public Faros language. <b style="color:#8B6FF0">Vision / principle</b> = principle &middot; inference &middot; roadmap. <b style="color:#D9A521">Research suggestion</b> = a new angle, or what to verify / test / build where Faros\'s stated facts and your principles don\'t settle the critic.</div>';
  s+=grp(act,'#2BB673','Actual &mdash; grounded answer');
  s+=grp(vis,'#8B6FF0','From your vision / principle');
  s+=grp(res,'#D9A521','Research suggestion');
  s+='</div>'; return s;
}
/* ---------- side panel ---------- */
const panel=document.getElementById('panel');
function badge(txt,col){return `<span class="badge" style="background:${col}22;color:${col};border:1px solid ${col}66">${txt}</span>`;}
function selectNode(id){
 const n=byId[id]; const color=css(TYPE[n.type]||'--mut');
 let h=`<div class="tags">${badge(n.type,color)}${badge(n.status, n.status==='approved'?css('--shipped'):css('--mut'))}`;
 if(n.honesty)h+=badge(n.honesty,{shipped:css('--shipped'),roadmap:css('--roadmap'),inference:css('--inference')}[n.honesty]);
 if(n.pillar&&n.pillar!=='all')h+=badge(n.pillar,css('--accent2'));
 h+=`</div><div class="ptitle">${n.title}</div><div class="kv"><b>id</b> ${n.id} · <b>provenance</b> ${n.provenance}</div>`;
 h+=`<div class="sec"><h4>Summary</h4><div class="sum">${n.summary}</div></div>`;
 h+=`<div class="sec"><h4>An interviewer might ask</h4><div class="q">“${n.interview_question}”</div></div>`;
 if(n.competitor){const cp=n.competitor;
  h+=`<div class="sec"><h4>A competitor positions against it</h4><div class="comp"><div class="top"><span class="mono" style="background:${cp.color}">${cp.mono}</span><span class="nm">${cp.name}</span><span class="dom">${cp.domain}</span></div><p>${cp.positioning}</p></div></div>`;
 } else { h+=`<div class="sec"><h4>Competitor</h4><div class="kv">Structural / framing node — no single direct competitor.</div></div>`; }
 h+=renderResponses(n.id);
 h+=`<div class="foot">Source of truth: assist-memory <b>dev/faros-case</b> + knowledge-tree (fetched 2026-06-30). Competitor lines from <b>insight/competitive-landscape</b>.</div>`;
 panel.innerHTML=h;
}
function selectTheme(id){
 const t=C.themes.find(x=>x.id===id);
 let h=`<div class="tags">${badge('critic cluster',t.color)}${badge(t.targets.length+' nodes hit',css('--mut'))}</div>`;
 h+=`<div class="ptitle">${t.label}</div><div class="sum">${t.desc}</div>`;
 h+=`<div class="sec"><h4>Who attacks here</h4><div class="tags">`+t.competitors.map(cp=>`<span class="chip"><span class="mono" style="background:${cp.color}">${cp.mono}</span>${cp.name}</span>`).join('')+`</div></div>`;
 h+=`<div class="sec"><h4>The hard questions in this cluster <span class=\"qhint\">(click one for answers + research)</span></h4><div class="qlist">`+t.questions.map(q=>`<div class="qitem" onclick="selectNode('${q.id}')"><div class="t">${byId[q.id].title.split(' — ')[0]}</div><div class="qq">“${q.q}”</div></div>`).join('')+`</div></div>`;
 h+=`<div class="foot">Critic graph derived from per-node competitor positioning + interviewer questions across the knowledge tree.</div>`;
 panel.innerHTML=h;
}
