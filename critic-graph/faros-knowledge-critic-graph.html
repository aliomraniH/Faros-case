t they stop before the AI session and spend."}}, {"id": "mapping:maya-roi-ledger", "type": "mapping", "title": "Mapping — Maya's board-ROI pain → Token Attribution Ledger", "parent": "organization:root", "status": "approved", "honesty": "shipped", "provenance": "sourced", "summary": "Maps Maya's 'can't tell the board what the spend produced' to the Token Attribution Ledger that ties dollars to shipped outcomes — the 'door' card.", "interview_question": "This is your opening move. What's the single proof point that makes the board believe the attribution?", "competitor": {"key": "harness", "name": "Harness", "domain": "harness.io", "color": "#00ADE4", "mono": "H", "positioning": "Harness AI DLC Insights targets the identical board-ROI buying moment with a 'token spend → shipped software' pitch."}}, {"id": "mapping:maya-tool-rationalization", "type": "mapping", "title": "Mapping — which AI tools/models are worth keeping → Optimize", "parent": "organization:root", "status": "approved", "honesty": "roadmap", "provenance": "sourced", "summary": "Maps 'too many tools/models — which to keep, scope, or cut' to Optimize's keep/scope/cut verdicts and per-task model recommendations.", "interview_question": "A keep/scope/cut verdict is a strong claim — what evidence backs a 'cut' recommendation that a VP would stake budget on?", "competitor": {"key": "vantage", "name": "Vantage", "domain": "vantage.sh", "color": "#0F172A", "mono": "V", "positioning": "Vantage and CloudZero already give spend-rationalization verdicts on the cost side; they own 'what to cut' for FinOps but can't tie it to delivered outcomes."}}, {"id": "mapping:maya-incident-observe", "type": "mapping", "title": "Mapping — Maya's incident-to-cause pain → Observe", "parent": "organization:root", "status": "approved", "honesty": "shipped", "provenance": "inferred", "summary": "Maps the 'trail goes cold at every tool boundary' pain to the Observe graph that joins the chain and reaches the one missing repo rule.", "interview_question": "What does 'the trail goes cold' look like in a real customer's stack, and how many boundaries does Observe actually cross unaided?", "competitor": {"key": "rootly", "name": "Rootly", "domain": "rootly.com", "color": "#FF4F64", "mono": "R", "positioning": "Rootly/incident.io own incident→PR causation and the on-call's trust; they argue root-cause lives in the incident tool, not an analytics graph."}}, {"id": "mapping:maya-learning-negmem", "type": "mapping", "title": "Mapping — Maya's repeat-mistakes pain → Negative Memory", "parent": "organization:root", "status": "approved", "honesty": "roadmap", "provenance": "inferred", "summary": "Maps 'agents repeat last week's mistake; lessons live in one senior's head' to replaying the failed session and writing the rule back into repo context.", "interview_question": "Negative memory is the most compelling story and it's roadmap — how do you sell the vision without over-promising it as shipped?", "competitor": {"key": "unblocked", "name": "Unblocked", "domain": "getunblocked.com", "color": "#7C3AED", "mono": "U", "positioning": "Unblocked and Pieces own developer/team memory of past context; they capture knowledge but not an org-level negative-memory governance loop."}}, {"id": "mapping:maya-predictability-delivery", "type": "mapping", "title": "Mapping — Maya's 'answer up, deliver commitments' → Predictable Delivery", "parent": "organization:root", "status": "proposed", "honesty": "inference", "provenance": "inferred", "summary": "Maps Maya's pressure to hit and report commitments without policing the team to delivery tracking, forecasting, and capacity analytics.", "interview_question": "You labelled this 'inference' — what's the evidence the delivery surface actually serves Maya's pain, not just exists on the site?", "competitor": {"key": "jellyfish", "name": "Jellyfish", "domain": "jellyfish.co", "color": "#00B3A4", "mono": "J", "positioning": "Jellyfish/LinearB are the established answer to 'predict ants the AI line item justified; adoption is uneven' to AI Transformation's causal ROI, cohort tests, CFO reports, and GAINS.", "interview_question": "What's your honest read on adoption — does Faros prove ROI, or just measure adoption and call it ROI?", "competitor": {"key": "jellyfish", "name": "Jellyfish", "domain": "jellyfish.co", "color": "#00B3A4", "mono": "J", "positioning": "Jellyfish's AI Impact is the incumbent 'prove AI adoption ROI' report; the buyer will demand the causal-vs-correlation distinction be made obvious."}}, {"id": "mapping:maya-surveillance-govern", "type": "mapping", "title": "Mapping — 'is this surveillance?' → repo/system-level governance", "parent": "organization:root", "status": "approved", "honesty": "shipped", "provenance": "inferred", "summary": "Maps the surveillance fear to the discipline that everything lands at repo/system level — context, flags, traces, policy — never individual keystrokes.", "interview_question": "What technically prevents a customer from using your data to rank or monitor individual engineers?", "competitor": {"key": "dx", "name": "DX (Atlassian)", "domain": "getdx.com", "color": "#111827", "mono": "DX", "positioning": "The anti-pattern is older developer-productivity/surveillance tooling that ranks individuals; Faros must visibly distance itself from that whole category."}}, {"id": "mapping:maya-govern-velocity", "type": "mapping", "title": "Mapping — govern AI merges without slowing down → compensating controls", "parent": "organization:root", "status": "approved", "honesty": "roadmap", "provenance": "inferred", "summary": "Maps 'govern AI merges without killing velocity' to compensating controls — ship behind a feature flag instead of a hard block; a human still merges.", "interview_question": "A feature flag is a developer convention, not governance — what makes this a control a CISO would sign off on?", "competitor": {"key": "copilot", "name": "GitHub Copilot", "domain": "github.com", "color": "#24292F", at is Faros — and why isn't it just another FinOps or DevEx dashboard?"}]}], "links": [{"theme": "correlation-not-causation", "node": "faros:ai-transformation"}, {"theme": "correlation-not-causation", "node": "faros:gains"}, {"theme": "correlation-not-causation", "node": "faros:executive-scorecards"}, {"theme": "correlation-not-causation", "node": "mapping:maya-adoption-aitransformation"}, {"theme": "correlation-not-causation", "node": "mapping:maya-roi-ledger"}, {"theme": "correlation-not-causation", "node": "flow:board-asks-roi"}, {"theme": "we-own-the-session", "node": "faros:clara-context-engine"}, {"theme": "we-own-the-session", "node": "faros:historical-replay"}, {"theme": "we-own-the-session", "node": "faros:model-routing"}, {"theme": "we-own-the-session", "node": "faros:optimize"}, {"theme": "we-own-the-session", "node": "mapping:maya-rework-context"}, {"theme": "we-are-the-graph", "node": "faros:observe"}, {"theme": "we-are-the-graph", "node": "faros:engineering-world-model"}, {"theme": "commodity-analytics", "node": "faros:developer-productivity"}, {"theme": "commodity-analytics", "node": "faros:dora-metrics"}, {"theme": "commodity-analytics", "node": "mapping:maya-devex-friction"}, {"theme": "commodity-analytics", "node": "principle:empower-not-police"}, {"theme": "commodity-analytics", "node": "mapping:maya-surveillance-govern"}, {"theme": "planning-incumbents", "node": "faros:delivery-excellence"}, {"theme": "planning-incumbents", "node": "faros:initiative-tracking"}, {"theme": "planning-incumbents", "node": "faros:software-capitalization"}, {"theme": "planning-incumbents", "node": "mapping:maya-predictability-delivery"}, {"theme": "spend-side-finops", "node": "faros:token-intelligence"}, {"theme": "spend-side-finops", "node": "faros:token-attribution-ledger"}, {"theme": "spend-side-finops", "node": "mapping:maya-tool-rationalization"}, {"theme": "governance-in-scm", "node": "faros:govern"}, {"theme": "governance-in-scm", "node": "faros:governance-guard /* ---------- pan/zoom ---------- */
const svg=document.getElementById('svg'), vp=document.getElementById('vp');
let view={x:0,y:0,k:1};
function apply(){vp.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();
 const mx=(e.clientX-r.left)/r.width*1000,my=(e.clientY-r.top)/r.height*1000;
 const f=e.deltaY<0?1.12:1/1.12;const nk=Math.max(.4,Math.min(4,view.k*f));
 view.x=mx-(mx-view.x)*(nk/view.k);view.y=my-(my-view.y)*(nk/view.k);view.k=nk;apply();},{passive:false});
let drag=null;
svg.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};svg.classList.add('drag');});
window.addEventListener('mousemove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();
 view.x=drag.vx+(e.clientX-drag.x)/r.width*1000;view.y=drag.vy+(e.clientY-drag.y)/r.height*1000;apply();});
window.addEventListener('mouseup',()=>{drag=null;svg.classList.remove('drag');});

function resetView(){view={x:0,y:0,k:1};apply();}
const SVGNS='http://www.w3.org/2000/svg';
function el(t,a){const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}

/* ---------- radial tree layout (deterministic) ---------- */
function buildTree(){
 const kids={}; G.nodes.forEach(n=>kids[n.id]=[]);
 let root=null;
 G.nodes.forEach(n=>{ if(n.parent && kids[n.parent]) kids[n.parent].push(n.id); else if(!n.parent) root=n.id; });
 // order children: faros subtree first, then flows, mappings, persona, principles
 const ord={faros:0,flow:1,mapping:2,persona:3,principle:4,organization:9};
 Object.values(kids).forEach(a=>a.sort((x,y)=>(ord[byId[x].type]-ord[byId[y].type])||x.localeCompare(y)));
 const leaves=id=>kids[id].length?kids[id].reduce((s,c)=>s+leaves(c),0):1;
 const pos={};
 const R=[0,150,265,360,440];
 function place(id,depth,a0,a1){
   const a=(a0+a1)/2, r=R[Math.min(depth,4)];
   pos[id]={x:500+r*Math.cos(a),y:500+r*Math.sin(a),depth,angle:a};
   const tot=leaves(id)||1; let acc=a0;
   kids[id].forEach(c=>{const span=(a1-a0)*(leaves(c)/tot);place(c,depth+1,acc,acc+span);acc+=span;});
 }
 place(root,0,-Math.PI/2, -Math.PI/2+2*Math.PI);
 pos[root]={x:500,y:500,depth:0,angle:0};
 return {kids,root,pos};
}

function drawGraph(){
 vp.innerHTML=''; resetView();
 const {kids,root,pos}=buildTree();
 // links
 G.nodes.forEach(n=>{ if(n.parent&&pos[n.parent]){const p=pos[n.parent],c=pos[n.id];
   const path=el('path',{class:'link','data-a':n.parent,'data-b':n.id,
    d:`M${p.x},${p.y} C ${(p.x+c.x)/2},${p.y} ${(p.x+c.x)/2},${c.y} ${c.x},${c.y}`}); vp.appendChild(path);} });
 // nodes
 G.nodes.forEach(n=>{
   const p=pos[n.id]; const g=el('g',{class:'node','data-id':n.id});
   const color=css(TYPE[n.type]||'--mut'); g.style.color=color;
   const rad = n.type==='faros'? (n.id==='faros:root'?16: (n.parent==='faros:root'?11:8)) : (n.id==='organization:root'?18:10);
   const c=el('circle',{r:rad,cx:p.x,cy:p.y,fill:'#0e1320',stroke:color,'stroke-width':n.status==='approved'?3:1.6});
   if(n.status!=='approved') c.setAttribute('stroke-dasharray','3,3');
   g.appendChild(c);
   // honesty ring dot
   if(n.honesty){const hc={shipped:css('--shipped'),roadmap:css('--roadmap'),inference:css('--inference')}[n.honesty];
     g.appendChild(el('circle',{r:3,cx:p.x+rad-1,cy:p.y-rad+1,fill:hc,stroke:'#0b0e17','stroke-width':1}));}
   const right=Math.cos(p.angle)>=0;
   const tx=el('text',{x:p.x+(right?rad+6:-(rad+6)),y:p.y+4,'text-anchor':right?'start':'end'});
   tx.textContent=short(n.title); g.appendChild(tx);
   g.addEventListener('click',()=>{selectNode(n.id);highlight(n.id,kids);});
   g.addEventListener('mouseenter',()=>highlight(n.id,kids));
   g.addEventListener('mouseleave',clearHi);
   vp.appendChild(g);
 });
}
function highlight(id,kids){
 const keep=new Set([id]); let cur=byId[id]; while(cur&&cur.parent){keep.add(cur.parent);cur=byId[cur.parent];}
 (function down(i){ (kids[i]||[]).forEach(c=>{keep.add(c);down(c);}); })(id);
 document.querySelectorAll('.node').forEach(g=>g.classList.toggle('dim',!keep.has(g.dataset.id)));
 document.querySelectorAll('#vp .link').forEach(l=>l.classList.toggle('dim',!(keep.has(l.dataset.a)&&keep.has(l.dataset.b))));
 const me=document.querySelector(`.node[data-id="${CSS.escape(id)}"]`); if(me)me.classList.add('hot');
}
function clearHi(){document.querySelectorAll('.node').forEach(g=>g.classList.remove('dim','hot'));document.querySelectorAll('#vp .link').forEach(l=>l.classList.remove('dim'));}

/* ---------- critic graph layout ---------- */
function drawCritic(){
 vp.innerHTML=''; resetView();
 const cx=500,cy=500, ringR=330, n=C.themes.length;
 // center hub
 vp.appendChild(el('circle',{cx,cy,r:54,fill:'#1a1020',stroke:css('--accent'),'stroke-width':3}));
 const ht=el('text',{x:cx,y:cy-4,'text-anchor':'middle'});ht.setAttribute('font-size','13');ht.setAttribute('font-weight','800');ht.style.fill=css('--ink');ht.textContent='Faros'; vp.appendChild(ht);
 const ht2=el('text',{x:cx,y:cy+13,'text-anchor':'middle'});ht2.setAttribute('font-size','10');ht2.style.fill=css('--mut');ht2.textContent='under fire'; vp.appendChild(ht2);
 C.themes.forEach((t,i)=>{
   const a=-Math.PI/2 + i/n*2*Math.PI;
   const x=cx+ringR*Math.cos(a), y=cy+ringR*Math.sin(a);
   t.__x=x;t.__y=y;
   const lk=el('path',{class:'link',d:`M${cx},${cy} C ${cx+(x-cx)*.4},${cy} ${x-(x-cx)*.4},${y} ${x},${y}`,'data-t':t.id});
   lk.style.stroke=t.color; lk.style.opacity=.5; lk.style.strokeWidth=Math.max(1.6,t.targets.length*0.7); vp.appendChild(lk);
 });
 C.themes.forEach((t)=>{
   const g=el('g',{class:'node','data-t':t.id}); g.style.color=t.color;
   const r=24+t.targets.length*2.2;
   g.appendChild(el('circle',{cx:t.__x,cy:t.__y,r,fill:'#11151f',stroke:t.color,'stroke-width':2.5}));
   const cnt=el('text',{x:t.__x,y:t.__y+5,'text-anchor':'middle'});cnt.setAttribute('font-size','15');cnt.setAttribute('font-weight','800');cnt.style.fill=t.color;cnt.style.stroke='none';cnt.textContent=t.targets.length;g.appendChild(cnt);
   // competitor monogram chips around the bubble
   t.competitors.slice(0,5).forEach((cp,j)=>{
     const ca=t.__x<cx? Math.PI: 0; const off=(j-(Math.min(t.competitors.length,5)-1)/2);
     const mx=t.__x+(t.__x<cx?-1:1)*(r+14), my=t.__y+off*20;
     const mg=el('g',{}); mg.appendChild(el('rect',{x:mx-9,y:my-9,width:18,height:18,rx:5,fill:cp.color,stroke:'#0b0e17','stroke-width':1}));
     const mt=el('text',{x:mx,y:my+4,'text-anchor':'middle'});mt.setAttribute('font-size','9');mt.setAttribute('font-weight','800');mt.style.fill='#fff';mt.style.stroke='none';mt.textContent=cp.mono;mg.appendChild(mt);g.appendChild(mg);
   });
   const lab=el('text',{x:t.__x,y:t.__y+r+15,'text-anchor':'middle'});lab.setAttribute('font-size','10.5');lab.textContent=t.label.replace(/[“”]/g,'').slice(0,34);g.appendChild(lab);
   g.addEventListener('click',()=>selectTheme(t.id));
   g.addEventListener('mouseenter',()=>{document.querySelectorAll('.node').forEach(o=>o.classList.toggle('dim',o!==g&&o.dataset.t!==undefined&&o.dataset.t!==t.id));
     document.querySelectorAll('#vp .link').forEach(l=>l.classList.toggle('dim',l.dataset.t!==t.id));g.classList.add('hot');});
   g.addEventListener('mouseleave',clearHi);
   vp.appendChild(g);
 });
}

/* ---------- side panel ---------- */
const panel=document.getElementById('panel');
function badge(txt,col){return `<span class="badge" style="background:${col}22;color:${col};border:1px solid ${col}66">${txt}</span>`;}
function selectNode(id){
 const n=byId[id]; const color=css(TYPE[n.type]||'--mut');
 let h=`<div class="tags">${badge(n.type,color)}${badge(n.status, n.status==='approved'?css('--shipped'):css('--mut'))}`;
 if(n.honesty)h+=badge(n.honesty,{shipped:css('--shipped'),roadmap:css('--roadmap'),inference:css('--inference')}[n.honesty]);
 if(n.pillar&&n.pillar!=='all')h+=badge(n.pillar,css('--accent2'));
 h+=`</div><div class="ptitle">${n.title}</div><div class="kv"><b>id</b> ${n.id} · <b>provenance</b> ${n.provenance}</div>`;
 h+=`<div class="sec"><h4>Summary</h4><div class="sum">${n.summary}</div></div>`;
 h+=`<div class="sec"><h4>An interviewer might ask</h4><div class="q">“${n.interview_question}”</div></div>`;
 if(n.competitor){const cp=n.competitor;
  h+=`<div class="sec"><h4>A competitor positions against it</h4><div class="comp"><div class="top"><span class="mono" style="background:${cp.color}">${cp.mono}</span><span class="nm">${cp.name}</span><span class="dom">${cp.domain}</span></div><p>${cp.positioning}</p></div></div>`;
 } else { h+=`<div class="sec"><h4>Competitor</h4><div class="kv">Structural / framing node — no single direct competitor.</div></div>`; }
 h+=`<div class="foot">Source of truth: assist-memory <b>dev/faros-case</b> + knowledge-tree (fetched 2026-06-30). Competitor lines from <b>insight/competitive-landscape</b>.</div>`;
 panel.innerHTML=h;
}
function selectTheme(id){
 const t=C.themes.find(x=>x.id===id);
 let h=`<div class="tags">${badge('critic cluster',t.color)}${badge(t.targets.length+' nodes hit',css('--mut'))}</div>`;
 h+=`<div class="ptitle">${t.label}</div><div class="sum">${t.desc}</div>`;
 h+=`<div class="sec"><h4>Who attacks here</h4><div class="tags">`+t.competitors.map(cp=>`<span class="chip"><span class="mono" style="background:${cp.color}">${cp.mono}</span>${cp.name}</span>`).join('')+`</div></div>`;
 h+=`<div class="sec"><h4>The hard questions in this cluster</h4><div class="qlist">`+t.questions.map(q=>`<div class="qitem"><div class="t">${byId[q.id].title.split(' — ')[0]}</div><div class="qq">“${q.q}”</div></div>`).join('')+`</div></div>`;
 h+=`<div class="foot">Critic graph derived from per-node competitor positioning + interviewer questions across the knowledge tree.</div>`;
 panel.innerHTML=h;
}
